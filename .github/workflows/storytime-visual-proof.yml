name: URAI Storytime Visual Proof

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: storytime-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-proof:
    name: Retain exact-head Storytime pixels
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE_DIR: /tmp/urai-storytime-visual-${{ github.event.pull_request.head.sha }}
      PLAYWRIGHT_VERSION: 1.55.0
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.event.pull_request.head.sha }}" ]]
          test -z "$(git status --porcelain)"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Build exact Storytime candidate
        run: npm run build

      - name: Start exact-head Storytime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          (npm run start -- --hostname 127.0.0.1 --port 3000 >"$EVIDENCE_DIR/server.log" 2>&1 & echo $! >"$EVIDENCE_DIR/server.pid")
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/storytime >/dev/null; then ready=1; break; fi
            sleep 1
          done
          [[ "$ready" == "1" ]] || { cat "$EVIDENCE_DIR/server.log"; exit 1; }

      - name: Assert public route health
        shell: bash
        run: |
          set -euo pipefail
          for route in /storytime /storytime/settings; do
            code=$(curl -sS -o "$EVIDENCE_DIR$(echo "$route" | tr '/' '-')".html -w '%{http_code}' "http://127.0.0.1:3000$route")
            [[ "$code" == "200" ]] || { echo "$route returned $code" >&2; exit 1; }
          done
          if grep -Eqi 'application error|internal server error|this page couldn.t load' "$EVIDENCE_DIR"/*.html; then
            echo 'Fatal application copy detected in rendered Storytime HTML.' >&2
            exit 1
          fi

      - name: Install pinned Chromium
        run: npx --yes playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium

      - name: Capture desktop and mobile pixels
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local device="$1"; local route="$2"; local out="$3"
            npx --yes playwright@${PLAYWRIGHT_VERSION} screenshot --device="$device" --full-page "http://127.0.0.1:3000$route" "$EVIDENCE_DIR/$out"
          }
          capture 'Desktop Chrome' /storytime storytime-home-desktop.png
          capture 'Pixel 5' /storytime storytime-home-mobile.png
          capture 'Desktop Chrome' /storytime/settings storytime-settings-desktop.png
          capture 'Pixel 5' /storytime/settings storytime-settings-mobile.png
          count=$(find "$EVIDENCE_DIR" -name '*.png' -size +0c | wc -l)
          [[ "$count" -eq 4 ]] || { echo "Expected 4 non-empty screenshots, found $count" >&2; exit 1; }
          sha256sum "$EVIDENCE_DIR"/*.png > "$EVIDENCE_DIR/screenshot-sha256.txt"

      - name: Write exact-head manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/manifest.txt" <<EOF
          repository=${GITHUB_REPOSITORY}
          exactHead=${{ github.event.pull_request.head.sha }}
          pullRequest=${{ github.event.pull_request.number }}
          node=22
          playwright=${PLAYWRIGHT_VERSION}
          screenshots=4
          routes=/storytime,/storytime/settings
          providerExecution=none
          productionData=none
          EOF
          test -z "$(git status --porcelain)"

      - name: Upload retained Storytime visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-storytime-visual-${{ github.event.pull_request.head.sha }}
          path: /tmp/urai-storytime-visual-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 90
