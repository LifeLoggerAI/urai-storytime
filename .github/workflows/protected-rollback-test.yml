name: URAI Storytime Rollback Source Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Evidence environment; this workflow performs source verification only.
        required: true
        type: choice
        options:
          - staging
          - production
      base_url:
        description: HTTPS URL associated with the source-verification packet.
        required: true
        type: string
      confirm:
        description: Type VERIFY_STORYTIME_ROLLBACK_SOURCE to authorize exact-revision source verification.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: storytime-protected-rollback-proof-${{ github.sha }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ROLLBACK_SHA: ${{ github.sha }}
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  BASE_URL: ${{ inputs.base_url }}

jobs:
  rollback-test:
    name: Verify rollback source without claiming an operational drill
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'VERIFY_STORYTIME_ROLLBACK_SOURCE'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact rollback revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.ROLLBACK_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable rollback source and bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_URL" =~ ^https://[^[:space:]]+$ ]]

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Verify exact rollback revision
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm --prefix functions ci --no-audit
          npm run lint
          npm run typecheck
          npm test
          npm run test:security-rules
          npm run test:emulator-scaffold
          npm run test:emulator-runtime
          npm run test:emulator-behavior-spec
          npm run build
          npm --prefix functions run build
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Write immutable rollback-source-verification manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-receipt
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const receipt = {
            schemaVersion: 'urai-storytime-protected-run-v1',
            role: 'rollback-source-verification',
            result: 'verification-success',
            environment: process.env.TARGET_ENVIRONMENT,
            deployedSha: process.env.ROLLBACK_SHA,
            deploymentUrl: process.env.BASE_URL,
            providerMutationPerformed: false,
            rollbackTested: false,
            operationalRollbackPerformed: false,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            workflowPath: '.github/workflows/protected-rollback-test.yml',
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          writeFileSync('release-receipt/manifest.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload immutable rollback-source-verification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storytime-rollback-source-verification-${{ env.TARGET_ENVIRONMENT }}-${{ env.ROLLBACK_SHA }}
          path: release-receipt/manifest.json
          if-no-files-found: error
          retention-days: 365
