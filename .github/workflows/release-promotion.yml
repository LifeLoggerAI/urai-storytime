name: URAI Storytime Release Promotion Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment to verify.
        required: true
        type: choice
        options:
          - staging
          - production
      base_url:
        description: Deployed HTTPS base URL to verify.
        required: true
        type: string
      rollback_sha:
        description: Expected 40-character rollback SHA for rollback verification.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: storytime-release-promotion-${{ github.sha }}-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.sha }}

jobs:
  release-promotion:
    name: Verify exact-head release promotion gates
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact dispatched candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean candidate and bounded inputs
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          BASE_URL: ${{ inputs.base_url }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          ROLLBACK_EVIDENCE_PATH: release-evidence/deployments/${{ inputs.environment }}/${{ inputs.rollback_sha }}.json
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          [[ "$BASE_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${ROLLBACK_SHA}^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA"
          test -f "$ROLLBACK_EVIDENCE_PATH"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Verify immutable environment rollback evidence
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          BASE_URL: ${{ inputs.base_url }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          ROLLBACK_EVIDENCE_PATH: release-evidence/deployments/${{ inputs.environment }}/${{ inputs.rollback_sha }}.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const evidencePath = process.env.ROLLBACK_EVIDENCE_PATH;
          const evidenceBytes = readFileSync(evidencePath);
          const evidence = JSON.parse(evidenceBytes.toString('utf8'));
          const expected = {
            environment: process.env.TARGET_ENVIRONMENT,
            deploymentUrl: process.env.BASE_URL,
            deployedSha: process.env.ROLLBACK_SHA.toLowerCase(),
          };
          const isHttps = (value) => typeof value === 'string' && /^https:\/\/[^\s]+$/.test(value);
          const isIsoDate = (value) => typeof value === 'string' && Number.isFinite(Date.parse(value));

          if (evidence.schemaVersion !== 'urai-storytime-deployment-evidence-v1') throw new Error('Unsupported rollback evidence schema.');
          if (evidence.environment !== expected.environment) throw new Error('Rollback evidence environment mismatch.');
          if (String(evidence.deployedSha ?? '').toLowerCase() !== expected.deployedSha) throw new Error('Rollback evidence SHA mismatch.');
          if (evidence.deploymentUrl !== expected.deploymentUrl || !isHttps(evidence.deploymentUrl)) throw new Error('Rollback evidence URL mismatch.');
          if (!isHttps(evidence.deploymentRunUrl)) throw new Error('Rollback evidence requires a deployment run URL.');
          if (!isIsoDate(evidence.deployedAt)) throw new Error('Rollback evidence requires a deployment timestamp.');
          if (evidence.smokeVerified !== true) throw new Error('Rollback revision is not smoke verified.');
          if (evidence.rollbackTested !== true) throw new Error('Rollback revision is not rollback tested.');
          if (!isHttps(evidence.rollbackTestRunUrl)) throw new Error('Rollback evidence requires a rollback test run URL.');
          if (typeof evidence.deploymentArtifactName !== 'string' || evidence.deploymentArtifactName.length < 8) throw new Error('Rollback evidence requires an immutable deployment artifact name.');
          if (typeof evidence.rollbackTestArtifactName !== 'string' || evidence.rollbackTestArtifactName.length < 8) throw new Error('Rollback evidence requires an immutable rollback-test artifact name.');
          if (!/^sha256:[a-f0-9]{64}$/.test(evidence.deploymentArtifactDigest ?? '')) throw new Error('Rollback evidence requires the deployment artifact digest.');
          if (!/^sha256:[a-f0-9]{64}$/.test(evidence.rollbackTestArtifactDigest ?? '')) throw new Error('Rollback evidence requires the rollback-test artifact digest.');

          const repository = process.env.GITHUB_REPOSITORY;
          const apiUrl = process.env.GITHUB_API_URL;
          const token = process.env.GITHUB_TOKEN;
          const runIdFromUrl = (value, field) => {
            const prefix = `https://github.com/${repository}/actions/runs/`;
            if (!value.startsWith(prefix) || !/^\d+$/.test(value.slice(prefix.length))) throw new Error(`${field} must identify an Actions run in ${repository}.`);
            return value.slice(prefix.length);
          };
          const github = async (path) => {
            const response = await fetch(`${apiUrl}${path}`, { headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, 'X-GitHub-Api-Version': '2022-11-28' } });
            if (!response.ok) throw new Error(`GitHub evidence lookup failed (${response.status}).`);
            return response.json();
          };
          const verifyRunAndArtifact = async (runUrl, artifactName, artifactDigest, kind, trustedWorkflowPath) => {
            const runId = runIdFromUrl(runUrl, `${kind} run URL`);
            const run = await github(`/repos/${repository}/actions/runs/${runId}`);
            if (run.conclusion !== 'success' || run.status !== 'completed') throw new Error(`${kind} run is not successful and terminal.`);
            if (String(run.head_sha).toLowerCase() !== expected.deployedSha) throw new Error(`${kind} run is not bound to the rollback SHA.`);
            if (run.event !== 'workflow_dispatch' || run.path !== trustedWorkflowPath) throw new Error(`${kind} run is not from the trusted protected workflow.`);
            const artifacts = await github(`/repos/${repository}/actions/runs/${runId}/artifacts?per_page=100`);
            const retained = artifacts.artifacts?.find((artifact) => artifact.name === artifactName && artifact.expired === false);
            if (!retained) throw new Error(`${kind} retained artifact is missing or expired.`);
            if (retained.digest !== artifactDigest) throw new Error(`${kind} artifact digest does not match the approved immutable manifest.`);
            const binding = `${expected.environment}-${expected.deployedSha}`;
            if (!artifactName.toLowerCase().includes(binding)) throw new Error(`${kind} artifact name is not bound to environment and rollback SHA.`);
          };

          await verifyRunAndArtifact(
            evidence.deploymentRunUrl,
            evidence.deploymentArtifactName,
            evidence.deploymentArtifactDigest,
            'Deployment',
            '.github/workflows/protected-deployment.yml'
          );
          await verifyRunAndArtifact(
            evidence.rollbackTestRunUrl,
            evidence.rollbackTestArtifactName,
            evidence.rollbackTestArtifactDigest,
            'Rollback test',
            '.github/workflows/protected-rollback-test.yml'
          );

          console.log(`Verified rollback evidence sha256:${createHash('sha256').update(evidenceBytes).digest('hex')}`);
          NODE

      - name: Install exact dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm --prefix functions ci --no-audit

      - name: Run baseline source verification
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run test:smoke
          npm run test:e2e
          npm run test:deployment
          npm run test:security-rules
          npm run test:emulator-scaffold
          npm run test:emulator-runtime
          npm run test:production-readiness
          npm run build
          npm --prefix functions run build

      - name: Verify provider wiring contract
        env:
          URAI_ANALYTICS_PROVIDER: ${{ secrets.URAI_ANALYTICS_PROVIDER }}
          URAI_MONITORING_PROVIDER: ${{ secrets.URAI_MONITORING_PROVIDER }}
          URAI_ALERTING_PROVIDER: ${{ secrets.URAI_ALERTING_PROVIDER }}
        run: npm run test:provider-wiring

      - name: Verify production evidence contract
        env:
          URAI_FIREBASE_PROJECT_ID: ${{ secrets.URAI_FIREBASE_PROJECT_ID }}
          URAI_FIREBASE_STAGING_TARGET: ${{ secrets.URAI_FIREBASE_STAGING_TARGET }}
          URAI_FIREBASE_PRODUCTION_TARGET: ${{ secrets.URAI_FIREBASE_PRODUCTION_TARGET }}
          URAI_FIREBASE_AUTH_VERIFIED: ${{ secrets.URAI_FIREBASE_AUTH_VERIFIED }}
          URAI_FIRESTORE_VERIFIED: ${{ secrets.URAI_FIRESTORE_VERIFIED }}
          URAI_STORAGE_RULES_VERIFIED: ${{ secrets.URAI_STORAGE_RULES_VERIFIED }}
          URAI_DEPLOY_VERIFIED: ${{ secrets.URAI_DEPLOY_VERIFIED }}
          URAI_SECRETS_VERIFIED: ${{ secrets.URAI_SECRETS_VERIFIED }}
          URAI_BILLING_PROVIDER: ${{ secrets.URAI_BILLING_PROVIDER }}
          URAI_LEGAL_APPROVED: ${{ secrets.URAI_LEGAL_APPROVED }}
          URAI_PRODUCTION_URL: ${{ inputs.base_url }}
          URAI_SMOKE_TEST_VERIFIED: ${{ secrets.URAI_SMOKE_TEST_VERIFIED }}
          URAI_SMOKE_TEST_EVIDENCE_URL: ${{ secrets.URAI_SMOKE_TEST_EVIDENCE_URL }}
        run: npm run test:production-evidence

      - name: Verify production smoke evidence contract
        env:
          URAI_PRODUCTION_URL: ${{ inputs.base_url }}
          URAI_SMOKE_TEST_VERIFIED: ${{ secrets.URAI_SMOKE_TEST_VERIFIED }}
          URAI_SMOKE_TEST_EVIDENCE_URL: ${{ secrets.URAI_SMOKE_TEST_EVIDENCE_URL }}
        run: npm run test:production-smoke

      - name: Retain exact-head release verification receipt
        if: always()
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          BASE_URL: ${{ inputs.base_url }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          ROLLBACK_EVIDENCE_PATH: release-evidence/deployments/${{ inputs.environment }}/${{ inputs.rollback_sha }}.json
        run: |
          set -euo pipefail
          mkdir -p ci-receipts
          rollback_evidence_sha256="missing"
          if test -f "$ROLLBACK_EVIDENCE_PATH"; then
            rollback_evidence_sha256="$(sha256sum "$ROLLBACK_EVIDENCE_PATH" | cut -d' ' -f1)"
          fi
          cat > ci-receipts/storytime-release-promotion.txt <<EOF
          Repository: ${GITHUB_REPOSITORY}
          Workflow: ${GITHUB_WORKFLOW}
          Run ID: ${GITHUB_RUN_ID}
          Exact candidate: ${TARGET_SHA}
          Checked out: $(git rev-parse HEAD)
          Environment: ${TARGET_ENVIRONMENT}
          Base URL: ${BASE_URL}
          Expected rollback SHA: ${ROLLBACK_SHA}
          Rollback evidence: ${ROLLBACK_EVIDENCE_PATH}
          Rollback evidence SHA-256: ${rollback_evidence_sha256}
          Deployment performed by workflow: false
          Provider mutation performed by workflow: false
          Certification: false
          EOF
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Upload exact-head release verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-storytime-release-promotion-${{ env.TARGET_SHA }}-${{ inputs.environment }}
          path: ci-receipts/storytime-release-promotion.txt
          if-no-files-found: error
          retention-days: 365
